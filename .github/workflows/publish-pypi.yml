name: Publicar mycep no PyPI

# Usa Trusted Publishing (OIDC) — sem token guardado em secret. Exige
# configurar o publisher no PyPI apontando para este repositório e workflow.
# Enquanto isso não existir, o passo de publicação falha de forma explícita
# em vez de vazar credencial alternativa.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install build pytest requests
      - name: Testes antes de empacotar
        run: PYTHONPATH=sdk/python/src pytest sdk/python/tests -q
      - name: Build
        working-directory: sdk/python
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk/python/dist/

  publicar:
    needs: construir
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
