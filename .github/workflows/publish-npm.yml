name: Publicar @model5/mycep-sdk no npm

# Publicação por Trusted Publisher (OIDC) — sem token guardado em lugar nenhum.
#
# O npm troca o token OIDC desta execução por uma credencial de curta duração,
# desde que o publisher esteja configurado na página do pacote apontando para
# ESTE repositório e ESTE arquivo de workflow. Com isso o pacote pode manter
# "Require 2FA and disallow bypass 2fa tokens", que é a opção mais restritiva
# e a recomendada pelo próprio npm.
#
# Se o publisher não estiver configurado, o passo falha de forma explícita —
# não há caminho alternativo com segredo.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # exigido pela troca OIDC

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: npm com suporte a Trusted Publishing
        # O npm que vem com o Node 20 é anterior ao recurso; sem esta linha a
        # publicação cai de volta em token e falha.
        run: npm install -g npm@latest

      - name: Build
        working-directory: sdk/typescript
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Confere o conteúdo do pacote
        working-directory: sdk/typescript
        run: |
          npm pack --dry-run
          # dist/ precisa existir: publicar só o package.json quebra quem instala.
          test -f dist/index.js || { echo 'build não gerou dist/'; exit 1; }

      - name: Publicar
        if: github.event_name == 'release'
        working-directory: sdk/typescript
        # `--provenance` funciona aqui porque a execução é em CI com OIDC.
        run: npm publish --access public --provenance
